# BITE-OS live ISO — autologin straight into the FULL riced desktop.
# Session=bite-os-hyprland boots the real BITE-OS rice (bite-os-live-setup
# rebuilds /home/bite from /etc/skel before sddm starts, and appends a
# live-only exec-once that opens the Calamares installer on top). The live
# demo IS the product — the dots must be visible from the first boot.
# The "Install BITE-OS" cage kiosk stays selectable in SDDM as a rescue
# session for GPUs where Hyprland itself won't start.
# High number (99) so nothing in the base/cachyos sddm config can override the
# session we boot into. On the INSTALLED system the `bite` live user does not
# exist, so this autologin simply no-ops and a normal login screen appears
# (the bite-os-firstboot-cleanup service also removes these live-only files).
[Autologin]
User=bite
Session=bite-os-hyprland.desktop
Relogin=true

[Theme]
Current=bite-os
