# The fluid greeter is the default. The original `bite-os` theme is still
# installed — swap Current= back to `bite-os` to return to it.
#
# SDDM reads this ONCE, when the daemon starts at boot. Logging out does not
# re-read it; a change here needs a reboot (or `systemctl restart sddm`).
[General]
# The fluid greeter reads /proc for its CPU/RAM gauges through QML's
# XMLHttpRequest, which Qt6 refuses for file:// unless this is set.
# GreeterEnvironment is how sddm passes env to the greeter process itself.
GreeterEnvironment=QML_XHR_ALLOW_FILE_READ=1

[Theme]
Current=bite-os-fluid
