# BITE-OS — the bite-os-fluid greeter draws live CPU/RAM gauges by reading
# /proc/stat and /proc/meminfo. The SDDM greeter has no process API, so the
# theme reads them through QML's XMLHttpRequest — and Qt6 refuses file:// URLs
# unless this is set. Without it the two gauges simply read "n/a"; nothing
# else in the theme depends on it.
[Service]
Environment=QML_XHR_ALLOW_FILE_READ=1
