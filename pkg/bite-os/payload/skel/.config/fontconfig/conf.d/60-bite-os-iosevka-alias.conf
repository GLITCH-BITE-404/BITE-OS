<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  BITE-OS: serpantinum hardcodes "Iosevka Nerd Font" in 46 places, every one of
  them an icon (checked). Upstream's installer downloads that font; BITE-OS does
  not run that installer and does not ship the 1.1 GB package. Without it, icon
  lookups fell through to whatever fontconfig found, including Font Awesome 7
  Free (Solid-only glyphs drawn as empty boxes) and regular Nerd Fonts, whose
  wide icons overflow their one-cell advance and sit 2-3.5px right of centre.

  Symbols Nerd Font is the icon-only Nerd Font: each icon's advance matches its
  real width, so a centred icon is actually centred, at full size. Measured:
  CPU +2.0 -> 0.0px, disk +2.5 -> 0.0px, net +3.5 -> -1.0px.
  JetBrainsMono Nerd Font is listed second for any stray non-icon character.
-->
<fontconfig>
  <match target="pattern">
    <test qual="any" name="family"><string>Iosevka Nerd Font</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Symbols Nerd Font</string>
      <string>JetBrainsMono Nerd Font</string>
    </edit>
  </match>
</fontconfig>
