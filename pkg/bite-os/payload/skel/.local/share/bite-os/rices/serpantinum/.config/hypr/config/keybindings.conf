# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ KEYBINDINGS (AUTOGENERATED)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ───────── Static Core Binds ─────────
gesture = 3, horizontal, workspace
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# ───────── Dynamic Settings Binds ─────────
bind = ALT, F4, exec, hyprctl dispatch killactive
bind = $mainMod SHIFT_L, F, exec, hyprctl dispatch togglefloating
binde = $mainMod SHIFT_L, left, resizeactive, -50 0
binde = $mainMod SHIFT_L, right, resizeactive, 50 0
binde = $mainMod SHIFT_L, up, resizeactive, 0 -50
binde = $mainMod SHIFT_L, down, resizeactive, 0 50
bind = $mainMod CTRL, left, movewindow, l
bind = $mainMod CTRL, right, movewindow, r
bind = $mainMod CTRL, up, movewindow, u
bind = $mainMod CTRL, down, movewindow, d
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, F, exec, firefox
bind = $mainMod, E, exec, nautilus
bind = $mainMod, R, exec, serpantinum reload
bind = $mainMod, C, exec, serpantinum msg toggle clipboard
bind = $mainMod, P, exec, serpantinum msg toggle movies
bind = $mainMod, D, exec, serpantinum msg toggle launcher
bind = $mainMod SHIFT_L, S, exec, serpantinum launch start
bind = $mainMod, Q, exec, serpantinum msg toggle music
bind = $mainMod, B, exec, serpantinum msg toggle battery
bind = $mainMod, W, exec, serpantinum msg toggle wallpaper
bind = $mainMod, S, exec, serpantinum msg toggle calendar
bind = $mainMod, N, exec, serpantinum msg toggle network
bind = $mainMod, V, exec, serpantinum msg toggle volume
bind = $mainMod, H, exec, serpantinum msg toggle guide
bindl = , XF86MonBrightnessDown, exec, serpantinum brightness lower
bindl = , XF86MonBrightnessUp, exec, serpantinum brightness raise
bindl = , Print, exec, serpantinum screenshot
bindl = SHIFT_L, Print, exec, serpantinum screenshot --edit
bindl = $mainMod, Print, exec, serpantinum screenshot --full
bindl = $mainMod SHIFT_L, Print, exec, serpantinum screenshot --full --edit
bindl = , XF86PowerOff, exec, serpantinum lock
bindel = $mainMod, L, exec, serpantinum lock
bindl = $mainMod, SPACE, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , xf86AudioMicMute, exec, serpantinum volume mic-toggle
bindl = , xf86audiomute, exec, serpantinum volume mute-toggle
bindel = , xf86audiolowervolume, exec, serpantinum volume lower
bindel = , xf86audioraisevolume, exec, serpantinum volume raise
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod, TAB, exec, ~/.config/hypr/scripts/focus_next_monitor.sh
bind = $mainMod CTRL, D, exec, bash ~/.config/glitch/bin/dots-switch.sh caelestia
bind = $mainMod, U, exec, $terminal -e bite-os-update
