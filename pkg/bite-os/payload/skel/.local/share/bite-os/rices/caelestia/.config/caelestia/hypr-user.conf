# Master's custom vibe tweaks

# Kill the ".conf config format" deprecation nag (Hyprland 0.56+).
# It's a plain notification, so just dismiss it after load. Runs on reload too.
exec = sleep 2 && hyprctl dismissnotify

general {
    gaps_in = 6
    # TRBL — smaller left gap shifts windows toward the dock side
    gaps_out = 12, 12, 12, 4
    border_size = 2
    col.active_border = rgba(bb9af7ff) 45deg
    col.inactive_border = rgba(565f89aa)
}

