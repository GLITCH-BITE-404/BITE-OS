# ############# Themes #############
env = QT_QPA_PLATFORMTHEME, qtengine
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = QT_AUTO_SCREEN_SCALE_FACTOR, 1
env = XCURSOR_THEME, $cursorTheme
env = XCURSOR_SIZE, $cursorSize

# ######## Toolkit backends ########
env = GDK_BACKEND, wayland,x11
env = QT_QPA_PLATFORM, wayland;xcb
env = SDL_VIDEODRIVER, wayland,x11,windows
env = CLUTTER_BACKEND, wayland
env = ELECTRON_OZONE_PLATFORM_HINT, auto

# ####### XDG specifications #######
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland

# ############# Others #############
env = _JAVA_AWT_WM_NONREPARENTING, 1
# NO hardcoded GPU driver forcing here (LIBVA_DRIVER_NAME=iHD /
# MESA_LOADER_DRIVER_NAME=iris were Intel-only and broke GL/VAAPI on AMD and
# NVIDIA machines). Mesa/libva autodetect the right driver on every GPU —
# including the builder's Intel iGPU, where iris/iHD are picked automatically.
env = XDG_SESSION_TYPE,wayland
env = NVD_BACKEND,direct
env = ANV_VIDEO_DECODE,1
