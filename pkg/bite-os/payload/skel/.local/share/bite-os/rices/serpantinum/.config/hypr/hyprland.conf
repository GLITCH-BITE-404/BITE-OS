source = ~/.config/hypr/colors.conf

# Kill the ".conf config format" deprecation nag (Hyprland 0.56+).
# It's a plain notification, so just dismiss it after load. Runs on reload too.
exec = sleep 2 && hyprctl dismissnotify

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ MODULAR CONFIGURATION
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

submap = passthru
# Dummy bind to force Hyprland to register the submap in memory.
# Since you will never press this, all normal keystrokes fall through to Quickshell
bind = SUPER SHIFT CTRL ALT, F35, exec, true
# ESCAPE HATCH — must exist INSIDE passthru too. This submap otherwise contains
# only the dummy bind above, so anything that leaves Hyprland in `passthru`
# swallows every keybind including the swap-back chord: a total lockout with no
# way out but a TTY. These two are the way out.
bind = SUPER CTRL, D, exec, bash ~/.config/glitch/bin/dots-switch.sh caelestia
bind = SUPER, Escape, exec, bash ~/.config/glitch/bin/dots-switch.sh caelestia
bind = SUPER SHIFT, Escape, exec, hyprctl dispatch submap reset
submap = reset

# --------------

source = ~/.config/hypr/config/monitors.conf
source = ~/.config/hypr/config/env.conf
source = ~/.config/hypr/config/autostart.conf
source = ~/.config/hypr/config/variables.conf
source = ~/.config/hypr/config/settings.conf
source = ~/.config/hypr/config/rules.conf
source = ~/.config/hypr/config/keybindings.conf


